<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CityMind AI Dashboard</title>
  <link rel="stylesheet" href="[unpkg.com](https://unpkg.com/leaflet@1.9.4/dist/leaflet.css)" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px; background: #1e293b; }
    h1 { margin: 0; font-size: 1.4rem; }
    .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 60px); }
    .panel { padding: 16px; overflow-y: auto; }
    .card { background: #1e293b; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .card h3 { margin: 0 0 6px; font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; }
    .card .value { font-size: 1.6rem; font-weight: 700; }
    .High { color: #f87171; } .Medium { color: #fbbf24; } .Low { color: #4ade80; } .Critical { color: #ef4444; }
    #map { height: 100%; }
    .alerts li { font-size: 0.85rem; margin-bottom: 6px; border-left: 3px solid #38bdf8; padding-left: 8px; }
  </style>
</head>
<body>
  <header><h1>🏙️ CityMind AI — Live City Status</h1></header>
  <div class="layout">
    <div class="panel">
      <div class="card"><h3>Traffic</h3><div class="value" id="traffic">-</div></div>
      <div class="card"><h3>Flood Risk</h3><div class="value" id="flood">-</div></div>
      <div class="card"><h3>Waste Alerts</h3><div class="value" id="waste">-</div></div>
      <div class="card"><h3>Streetlights Faulty</h3><div class="value" id="lights">-</div></div>
      <div class="card"><h3>Emergency Active</h3><div class="value" id="emergency">-</div></div>
      <div class="card"><h3>Recent Alerts</h3><ul class="alerts" id="alerts"></ul></div>
    </div>
    <div id="map"></div>
  </div>

  <script src="[unpkg.com](https://unpkg.com/leaflet@1.9.4/dist/leaflet.js)"></script>
  <script>
    const API = "[localhost](http://localhost:8000)";
    const map = L.map('map').setView([28.615, 77.21], 13);
    L.tileLayer('[{s}.tile.openstreetmap.org](https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png)').addTo(map);

    function setLevel(el, text) {
      el.textContent = text;
      el.className = "value " + text;
    }

    async function refresh() {
      const res = await fetch(`${API}/dashboard/status`);
      const data = await res.json();

      setLevel(document.getElementById("traffic"), data.traffic_level);
      setLevel(document.getElementById("flood"), data.flood_risk.level);
      document.getElementById("waste").textContent = data.waste_alerts;
      document.getElementById("lights").textContent = data.streetlights_faulty;
      document.getElementById("emergency").textContent = data.emergency_active;

      const list = document.getElementById("alerts");
      list.innerHTML = "";
      data.alerts.forEach(a => {
        const li = document.createElement("li");
        li.textContent = a;
        list.appendChild(li);
      });
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
